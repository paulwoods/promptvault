name: Publish Backend

on:
  push:
    branches: [ develop ]

concurrency:
  group: publish-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Set before the build, not after: the Dockerfile copies a prebuilt jar, so
      # build-info.properties — and therefore the version the running app
      # reports — is frozen at whatever the pom said when `verify` ran. Bumping
      # afterwards tagged every image one version ahead of the jar inside it.
      # Committed later, once the image is published.
      - name: Set version
        id: version
        run: |
          CURRENT=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          ./mvnw -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and verify
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: paulwoods/promptvault-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pushed only once the image exists, so a failed build never leaves an
      # orphaned bump on the branch.
      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags --exit-code origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists on remote; skipping."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          if ! git push origin "v${VERSION}" 2>push.err; then
            if grep -q "already exists" push.err; then
              echo "Tag v${VERSION} was created concurrently by another workflow; treating as success."
              exit 0
            fi
            cat push.err >&2
            exit 1
          fi
