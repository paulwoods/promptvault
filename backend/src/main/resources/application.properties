spring.application.name=backend

# Flyway owns the schema; Hibernate only validates entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/promptvault}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:promptvault}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:xxxxxxxxxxxxxxxxxxxxxxx}

