spring.application.name=backend

# Default to the dev profile for local runs; override with SPRING_PROFILES_ACTIVE.
spring.profiles.active=dev

# Flyway owns the schema; Hibernate only validates entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/promptvault}
spring.datasource.username=${DATABASE_USERNAME:promptvault}
spring.datasource.password=${DATABASE_PASSWORD:promptvault}
