spring.application.name=backend

# Flyway owns the schema; Hibernate only validates entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/promptvault}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:promptvault}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:xxxxxxxxx}

# Google sign-in (ADR-0011). Optional: unset means the feature is off and the
# SPA renders no Google button. The env var is GOOGLE_CLIENT_ID, so it needs
# binding explicitly - relaxed binding alone would look for
# PROMPTVAULT_GOOGLE_CLIENT_ID.
promptvault.google.client-id=${GOOGLE_CLIENT_ID:}

# Controller entry logging (method name + parameters). Off by default: it logs
# user emails and prompt sizes. Uncomment locally, or set
# LOGGING_LEVEL_COM_PROMPTVAULT=DEBUG in the environment (e.g. docker-compose).

