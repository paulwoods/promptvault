spring.application.name=backend

# Configuration is read from the environment (see .env.example).
# Datasource is consumed once Spring Data JPA is wired in Phase 1.1; the
# dev defaults match the docker-compose Postgres so a fresh clone runs.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/promptvault}
spring.datasource.username=${DATABASE_USERNAME:promptvault}
spring.datasource.password=${DATABASE_PASSWORD:promptvault}
