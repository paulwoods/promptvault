# Test profile: the datasource is supplied by Testcontainers (@ServiceConnection),
# so no spring.datasource.* here. Flyway clean is permitted under test only.
spring.flyway.clean-disabled=false

# Fixed throwaway secrets for tests (never used outside the suite).
promptvault.jwt.secret=test-only-jwt-secret-test-only-jwt-secret-0123456789
promptvault.enc.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# Hermetic tests: pin the env-derived settings so a developer's real .env
# sourced into the shell (per the README quickstart) cannot leak into the test
# JVM. An exported GOOGLE_CLIENT_ID reaches the application.properties
# placeholder and flips the suite into a "sign-in configured" context, which
# breaks GoogleSignInDisabledTest and diverges from every other context in the
# suite. Defining the property here makes this profile's plain (empty) entry
# win, so the placeholder - and with it the shell - is never consulted.
# GoogleLoginTest pins its own test client id via @TestPropertySource, which
# outranks property files either way.
promptvault.google.client-id=
